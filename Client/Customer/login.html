<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Kano CleanRoute</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blue-50 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full relative">
        <div class="text-center mb-6">
            <span class="text-5xl">♻️</span>
            <h3 class="text-2xl font-bold text-emerald-600 mt-4">Welcome Back</h3>
            <p class="text-gray-600 text-sm">Login to access your dashboard.</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Phone or Email</label>
                <input type="text" id="login-id" required class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="login-password" required class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
            
            <div id="login-error-msg" class="text-red-500 text-sm hidden text-center font-bold"></div>
            
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition-transform hover:scale-[1.02]">LOG IN</button>
        </form>
        
        <p class="text-sm text-center text-gray-500 mt-6">
            New Resident? <a href="register.html" class="text-emerald-600 font-bold hover:underline">Create Account</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
