<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANO CLEANROUTE | Admin Login</title>
    <style>
        /* --- LOGIN STYLES --- */
        body { margin: 0; height: 100vh; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; background: #0f172a; }
        .login-box { background: #ffffff; padding: 3rem; border-radius: 0.75rem; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        
        .btn { background: #0f766e; color: white; padding: 0.75rem 1.5rem; border-radius: 0.375rem; border: none; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn:hover { background: #115e59; }
        
        input { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.375rem; margin-bottom: 1rem; box-sizing: border-box; }
        label { display: block; text-align: left; font-size: 0.8rem; color: #64748b; font-weight: 600; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

    <div class="login-box">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🏙️</div>
        <h1 style="margin: 0; color: #0f766e; font-size: 1.5rem;">KANO CLEANROUTE</h1>
        <p style="color: #94a3b8; margin-bottom: 2rem;">Dispatcher Command Center</p>
        
        <form id="loginForm">
            <div>
                <label>USERNAME</label>
                <input type="text" id="username" placeholder="Enter Admin ID" required>
                
                <label>PASSWORD</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="btn">SECURE LOGIN</button>
            <p id="error-msg" style="color: #ef4444; font-size: 0.8rem; margin-top: 1rem; display: none;"></p>
        </form>
    </div>

    <script src="/js/auth.js"></script>

</body>
</html>
